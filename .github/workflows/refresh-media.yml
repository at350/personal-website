# Refreshes src/lib/media/live.json from configured feeds (letterboxd,
# substack, X) and commits the snapshot if it changed, so the deployed site
# updates itself without a server. The script exits 0 even when every feed
# fails, and only rewrites the snapshot when at least one succeeds.
#
# Runs every two hours: a film logged on letterboxd reaches alantai.me within
# one cycle. Refresh runs are cheap (one install and a few RSS fetches); the
# expensive rebuild below only happens on the cycles that actually found
# something new.
#
# Configure repository secrets (all optional — unset feeds are skipped):
#   LETTERBOXD_USER, SUBSTACK_RSS_URL, X_BEARER_TOKEN, X_USER_ID
name: refresh media

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch the deploy workflow after committing (see below).
  actions: write

# Never let two refreshes race for the same push.
concurrency:
  group: refresh-media
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run refresh-media
        env:
          # Unset is fine: the script falls back to the account baked into it
          # (DEFAULT_LETTERBOXD_USER). Set the secret only to point elsewhere.
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
          SUBSTACK_RSS_URL: ${{ secrets.SUBSTACK_RSS_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}

      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/media/live.json public/media/thumbs
          if git diff --quiet --cached; then
            echo "live.json unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh media snapshot"
          # A human push can land between our checkout and this push; rebase
          # the snapshot commit onto whatever main has become and try again.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not push the snapshot after 3 attempts." >&2
          exit 1

      # A push authenticated with GITHUB_TOKEN deliberately does not start
      # another workflow run, so deploy.yml — which triggers on push — would
      # never see the snapshot and alantai.me would keep serving the previous
      # one. workflow_dispatch is the documented exception to that rule, so
      # ask Pages to rebuild explicitly. Without this step the library stops
      # updating even though the commits keep landing. Only main may dispatch
      # it: deploy.yml publishes to production Pages and already restricts
      # itself to that branch.
      - name: Deploy the new snapshot
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
