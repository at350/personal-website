# Refreshes the media snapshot (src/lib/media/live.json plus the mirrored
# thumbnails under public/media/thumbs/) from configured feeds (letterboxd,
# goodreads, substack, X, LinkedIn) and publishes it when it changed, so the deployed
# site updates itself without a server. The script exits 0 even when every
# feed fails, and only rewrites the snapshot when at least one succeeds and
# the item list actually differs from the previous one.
#
# The snapshot never lands on main. It lives on the `media-snapshot` branch
# as ONE parentless commit holding only the two snapshot paths; each changed
# refresh force-replaces that commit, so the branch never accumulates history
# and main's log stays a log of real work rather than two-hourly chores. Both
# this workflow and deploy.yml overlay that branch onto the checkout before
# doing anything else (see .github/actions/overlay-media-snapshot). main keeps
# a hand-refreshed baseline so local dev and the tests work offline.
#
# Runs every two hours: a film logged on letterboxd reaches alantai.me within
# one cycle. Refresh runs are cheap (one install and a few RSS fetches); the
# expensive rebuild below only happens on the cycles that actually found
# something new.
#
# Configure repository secrets (all optional — unset feeds are skipped):
#   LETTERBOXD_USER, GOODREADS_USER_ID, SUBSTACK_RSS_URL, ANYAPI_KEY,
#   X_HANDLE, LINKEDIN_PROFILE_URL, X_BEARER_TOKEN, X_USER_ID
#
# ANYAPI_KEY turns on BOTH social feeds (getanyapi.com) with one credential:
# recent X posts and recent LinkedIn posts. Those two lanes cost money per
# call, so unlike the free letterboxd RSS they refresh twice a week (Monday
# and Thursday, 06:17 UTC) and carry their items forward on every other cycle
# — together about 18 cents a month. Without the key the script falls back to
# the direct X API, which needs X_BEARER_TOKEN + X_USER_ID and a paid plan.
name: refresh media

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force_social:
        description: >-
          Fetch the paid X and LinkedIn lanes even when they are not due.
          They normally refresh twice a week; tick this to pull them now.
        type: boolean
        default: false

permissions:
  # Force-pushing the media-snapshot branch. main is never written.
  contents: write
  # Needed to dispatch the deploy workflow after publishing (see below).
  actions: write

# Never let two refreshes race for the same branch: a force-push cannot
# conflict, but two overlapping runs could still publish out of order.
concurrency:
  group: refresh-media
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before the script runs, so that carry-forward reads the live snapshot
      # (not main's stale baseline) and so the tree recorded here is what the
      # result is compared against.
      - name: Overlay the live media snapshot
        id: overlay
        uses: ./.github/actions/overlay-media-snapshot

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run refresh-media
        env:
          # Unset is fine: the script falls back to the account baked into it
          # (DEFAULT_LETTERBOXD_USER). Set the secret only to point elsewhere.
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
          # Unset is fine here too: the script falls back to the numeric id
          # baked into it (DEFAULT_GOODREADS_USER_ID). Set the secret only to
          # point the bookshelf at another account.
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          SUBSTACK_RSS_URL: ${{ secrets.SUBSTACK_RSS_URL }}
          # Preferred source for recent X and LinkedIn posts — one key, both
          # lanes. Also unset-safe: the handle and profile URL fall back to the
          # defaults baked into the script, and with no key both feeds are
          # simply skipped and the previous snapshot's posts carry forward.
          ANYAPI_KEY: ${{ secrets.ANYAPI_KEY }}
          # Empty on a scheduled run, so the twice-weekly gate applies; "1"
          # only when a human ticks the box on a manual dispatch.
          ANYAPI_ALWAYS: ${{ inputs.force_social && '1' || '' }}
          X_HANDLE: ${{ secrets.X_HANDLE }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
          # Only consulted when ANYAPI_KEY is absent — never both, since two
          # feeds named "x" would double-count and corrupt carry-forward.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}

      # Publishes the snapshot as a single commit with NO parent whose tree
      # holds only the two snapshot paths, then force-replaces the branch tip
      # with it. Parentless means the branch is always exactly one commit
      # deep; only-two-paths means it can never be mistaken for a copy of
      # main; force-replacing an unrelated commit cannot conflict, which is
      # why the old rebase-and-retry loop is gone. main is never touched: the
      # repository's own index and HEAD are not involved at all.
      #
      # Only main may publish. The media-snapshot branch is what production
      # deploys from, and a workflow_dispatch can be run against any branch;
      # without this gate an experiment on a feature branch would force-replace
      # the live site's snapshot. Other refs get the dry run below instead.
      - name: Publish the snapshot if it changed
        id: publish
        if: github.ref_name == 'main'
        env:
          BASELINE_TREE: ${{ steps.overlay.outputs.tree }}
          SNAPSHOT_TREE: .github/actions/overlay-media-snapshot/snapshot-tree.sh
        run: |
          set -euo pipefail
          tree="$("$SNAPSHOT_TREE")"
          if [ "$tree" = "$BASELINE_TREE" ]; then
            echo "media snapshot unchanged; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit="$(git commit-tree "$tree" -m "media snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          git push --force origin "$commit:refs/heads/media-snapshot"
          echo "published parentless snapshot $commit to media-snapshot."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The same comparison for a run dispatched on any other ref, minus the
      # push: it reports whether the refresh would have published, so a branch
      # can prove the script still finds something new without ever being
      # able to replace production's snapshot.
      - name: Dry run — report whether the snapshot changed (non-main ref)
        if: github.ref_name != 'main'
        env:
          BASELINE_TREE: ${{ steps.overlay.outputs.tree }}
          SNAPSHOT_TREE: .github/actions/overlay-media-snapshot/snapshot-tree.sh
        run: |
          set -euo pipefail
          tree="$("$SNAPSHOT_TREE")"
          if [ "$tree" = "$BASELINE_TREE" ]; then
            echo "dry run on ${GITHUB_REF_NAME}: media snapshot unchanged."
          else
            echo "dry run on ${GITHUB_REF_NAME}: media snapshot would change" \
              "(tree $tree vs baseline $BASELINE_TREE); not publishing from a non-main ref."
          fi

      # A push authenticated with GITHUB_TOKEN deliberately does not start
      # another workflow run — and deploy.yml only watches main anyway, which
      # the snapshot branch never touches — so alantai.me would keep serving
      # the previous snapshot. workflow_dispatch is the documented exception
      # to that rule, so ask Pages to rebuild explicitly; deploy.yml then
      # overlays the fresh branch before it builds. Without this step the
      # library stops updating even though the snapshots keep landing. Only
      # main may dispatch it: deploy.yml publishes to production Pages and
      # already restricts itself to that branch.
      - name: Deploy the new snapshot
        if: steps.publish.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
