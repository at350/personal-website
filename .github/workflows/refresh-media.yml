# Refreshes src/lib/media/live.json from configured feeds (letterboxd,
# substack, X) once a day and commits the snapshot if it changed, so the
# deployed site updates itself without a server. The script exits 0 even when
# every feed fails, and only rewrites the snapshot when at least one succeeds.
#
# Configure repository secrets (all optional — unset feeds are skipped):
#   LETTERBOXD_USER, SUBSTACK_RSS_URL, X_BEARER_TOKEN, X_USER_ID
name: refresh media

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run refresh-media
        env:
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
          SUBSTACK_RSS_URL: ${{ secrets.SUBSTACK_RSS_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/media/live.json
          if git diff --quiet --cached; then
            echo "live.json unchanged; nothing to commit."
          else
            git commit -m "chore: refresh media snapshot"
            git push
          fi
