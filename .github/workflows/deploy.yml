name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # main only carries a hand-refreshed baseline of the media library; the
      # live snapshot is a parentless commit on the media-snapshot branch (see
      # refresh-media.yml). Lay it over the checkout before lint, test, and
      # build so the site ships what the last refresh found. Fetching a
      # branch is a read, so `contents: read` above is enough.
      - name: Overlay the live media snapshot
        uses: ./.github/actions/overlay-media-snapshot

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /
          SITE_URL: https://alantai.me
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
