<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Everything between the head markers is the cover's copy, which is what
         the dev server shows. scripts/prerender.mjs swaps the block for each
         route's own tags at build time; src/lib/meta.ts keeps them current
         as the router moves. -->
    <!--head:start-->
    <title>Alan Tai</title>
    <meta
      name="description"
      content="Alan Tai builds software, research, and early-stage products. Issue No. 01."
    />
    <link rel="canonical" href="https://alantai.me/" />
    <meta property="og:title" content="Alan Tai" />
    <meta
      property="og:description"
      content="Alan Tai builds software, research, and early-stage products. Issue No. 01."
    />
    <meta property="og:url" content="https://alantai.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://alantai.me/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alan Tai — A Personal Issue, No. 01" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alan Tai" />
    <meta
      name="twitter:description"
      content="Alan Tai builds software, research, and early-stage products. Issue No. 01."
    />
    <meta name="twitter:image" content="https://alantai.me/og.png" />
    <meta name="twitter:image:alt" content="Alan Tai — A Personal Issue, No. 01" />
    <!--head:end-->
    <!-- Every route is printed to static HTML at build time: the whole issue
         as the reader stack sits inside #root as .prerender. Crawlers, social
         scrapers and readers without JavaScript get the full magazine as real
         markup. A visitor with JavaScript should go straight to the app
         instead, so the js class hides that stack before first paint — no
         flash of the reader before the book's entry loader — and React
         replaces it on its first commit. -->
    <script>document.documentElement.classList.add("js")</script>
    <style>html.js .prerender{display:none}</style>
  </head>
  <body style="background:#ffffff">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
