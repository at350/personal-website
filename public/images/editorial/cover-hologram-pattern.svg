<svg xmlns="http://www.w3.org/2000/svg" width="640" height="853" viewBox="0 0 640 853" fill="none">
  <defs>
    <!-- These silhouettes use the exact crop of cover-fold.webp on the cover,
         so the foil belongs to its existing paper planes instead of drawing a
         second A over the photograph. -->
    <clipPath id="front-plane">
      <path d="M593 260 554 394 503 550 450 724 271 694 412 322Z"/>
    </clipPath>
    <clipPath id="right-leg">
      <path d="m504 561 82-8 37 176-87-10Z"/>
    </clipPath>
    <linearGradient id="front-foil" x1="320" y1="674" x2="568" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="leg-foil" x1="540" y1="716" x2="576" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="soft-edge" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>

  <!-- Inset, feathered coatings expose the photograph's own silhouette. The
       red bridge, dark rear fold, counter, type, rule and footer stay clean. -->
  <g clip-path="url(#front-plane)">
    <path d="M584 273 547 397 497 551 445 713 283 686 417 334Z" fill="url(#front-foil)" filter="url(#soft-edge)"/>
  </g>
  <g clip-path="url(#right-leg)">
    <path d="m512 568 68-7 33 157-71-8Z" fill="url(#leg-foil)" filter="url(#soft-edge)"/>
  </g>
</svg>
